<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Musiqa Playlist</title>
<style>
:root{--bg:#f4f3fa;--bg2:#e9e6f7;--cd:#fff;--tx:#17142a;--mu:#7a7694;--ac:#7c4dff;--ac2:#ff4d8d;--bd:#e3e0f2;--g:linear-gradient(135deg,#7c4dff,#ff4d8d);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0a16;--bg2:#171329;--cd:#181530;--tx:#f1eefc;--mu:#9a95b8;--bd:#2a2547;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c0a16;--bg2:#171329;--cd:#181530;--tx:#f1eefc;--mu:#9a95b8;--bd:#2a2547;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(900px 500px at 80% -10%,var(--bg2),transparent),var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
button,input{font:inherit;color:var(--tx)}button{cursor:pointer}
#app{max-width:820px;margin:0 auto;padding:18px 16px 190px}
h1{font-size:26px;margin:6px 0 4px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:17px;margin:22px 0 10px}
.mu{color:var(--mu);font-size:13px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 6px 24px rgba(80,50,200,.07)}
.btn{border:1px solid var(--bd);background:var(--cd);padding:10px 16px;border-radius:12px}
.btn.p{background:var(--g);border:0;color:#fff;font-weight:600}
.ic{border:0;background:transparent;font-size:19px;padding:6px 8px;border-radius:10px}
input[type=text],input[type=search]{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--cd);margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px}.sp{flex:1;min-width:0}
.sp b,.sp div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.cv{width:50px;height:50px;border-radius:12px;background-size:cover;background-position:center;flex:none;display:grid;place-items:center;color:#fff;font-size:20px}
.song{padding:8px;border-radius:14px}.song:active,.song.on{background:var(--bg2)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{text-align:center;padding:14px 6px}.stat b{font-size:24px;display:block}
.av{width:46px;height:46px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--cd) 88%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav div{display:flex;width:100%;max-width:820px}
nav button{flex:1;border:0;background:none;padding:6px 0;font-size:11px;color:var(--mu);display:grid;gap:2px;justify-items:center}
nav button i{font-style:normal;font-size:20px}nav button.on{color:var(--ac);font-weight:700}
#mini{position:fixed;left:10px;right:10px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:6;max-width:800px;margin:0 auto;background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:8px 10px;box-shadow:0 10px 30px rgba(60,30,160,.25)}
#mini .bar{height:3px;background:var(--bd);border-radius:3px;margin-top:6px}#mini .bar i{display:block;height:100%;width:0;background:var(--g);border-radius:3px}
#full{position:fixed;inset:0;z-index:20;background:var(--bg);padding:calc(16px + env(safe-area-inset-top,0px)) 22px calc(22px + env(safe-area-inset-bottom,0px));display:none;flex-direction:column;overflow:auto}
#full.show{display:flex}
#big{width:min(78vw,340px);aspect-ratio:1;border-radius:26px;margin:14px auto;box-shadow:0 20px 50px rgba(124,77,255,.35);background-size:cover;background-position:center;display:grid;place-items:center;font-size:80px;color:#fff}
input[type=range]{width:100%;accent-color:var(--ac)}
.ctl{display:flex;justify-content:center;align-items:center;gap:14px;margin:10px 0}
.ctl .ic{font-size:26px}.ctl .play{width:68px;height:68px;border-radius:50%;background:var(--g);color:#fff;font-size:28px;border:0}
.on2{color:var(--ac)}
#mod{position:fixed;inset:0;z-index:30;background:rgba(10,5,30,.6);display:none;align-items:flex-end;justify-content:center}
#mod.show{display:flex}#mod>div{background:var(--cd);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
</style></head><body>
<div id="app"><p class="mu">Yuklanmoqda…</p></div>
<div id="mini" hidden><div class="row"><div class="cv" id="mcv"></div><div class="sp" id="mtt" style="cursor:pointer"></div><button class="ic" id="mpp">▶</button><button class="ic" id="mnx">⏭</button></div><div class="bar"><i id="mbar"></i></div></div>
<div id="full"><div class="row"><button class="ic" id="fcl">⌄</button><div class="sp mu" style="text-align:center">Hozir ijro etilmoqda</div><button class="ic" id="ffv">♡</button></div>
<div id="big"></div><div style="text-align:center"><b id="ftt" style="font-size:20px"></b><div class="mu" id="far"></div></div>
<div style="margin-top:16px"><input type="range" id="sk" min="0" max="100" step="0.1" value="0"><div class="row mu"><span id="t1">0:00</span><span class="sp"></span><span id="t2">0:00</span></div></div>
<div class="ctl"><button class="ic" id="sh">🔀</button><button class="ic" id="pv">⏮</button><button class="play" id="fpp">▶</button><button class="ic" id="nx">⏭</button><button class="ic" id="rp">🔁</button></div>
<div class="row" style="justify-content:center"><button class="btn" id="ted" hidden>✂️ Qirqish / tahrirlash</button></div></div>
<div id="mod"><div id="modc"></div></div>
<nav><div id="nv"></div></nav>
<audio id="au" preload="metadata"></audio>
<script>
(async()=>{
const $=id=>document.getElementById(id),app=$('app'),au=$('au');
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db,user,assets,uid,people=[],me=null,tab='home',open=null,q='',queue=[],qi=0,cur=null,shuf=false,rep=false;
try{
const idb=await new Promise((ok,no)=>{const r=indexedDB.open('musiqa',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('bl')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=(n,m,f)=>new Promise((ok,no)=>{const t=idb.transaction(n,m),q=f(t.objectStore(n));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)});
const U=new Map(),R=new Map(),subs=new Set();
const res=async o=>{if(typeof o=='string'&&o.startsWith('idb:')){const id=o.slice(4);if(!U.has(id)){const b=await tx('bl','readonly',x=>x.get(id));if(!b)return'';const u=URL.createObjectURL(b);U.set(id,u);R.set(u,'idb:'+id)}return U.get(id)}
 if(Array.isArray(o))return Promise.all(o.map(res));if(o&&typeof o=='object'){const r={};for(const k in o)r[k]=await res(o[k]);return r}return o};
const unres=o=>typeof o=='string'?(R.get(o)||o):Array.isArray(o)?o.map(unres):o&&typeof o=='object'?Object.fromEntries(Object.entries(o).map(([k,v])=>[k,unres(v)])):o;
async function emit(){const v=await tx('kv','readonly',x=>x.getAll());const docs=[];for(const x of v){const{_id,...r}=x;const d=await res(r);docs.push({id:_id,exists:true,data:()=>d})}subs.forEach(f=>f({docs}))}
const myid=localStorage.getItem('uid')||('u'+Date.now().toString(36));localStorage.setItem('uid',myid);
user={id:async()=>myid};
db={doc:p=>{const id=p.split('/')[1];return{
 set:async d=>{await tx('kv','readwrite',x=>x.put({...unres(d),_id:id},id));emit()},
 update:async d=>{const old=(await tx('kv','readonly',x=>x.get(id)))||{};await tx('kv','readwrite',x=>x.put({...old,...unres(d),_id:id},id));emit()}}},
 collection:()=>({onSnapshot:f=>{subs.add(f);emit();return()=>subs.delete(f)}})};
assets={upload:async b=>{const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);await tx('bl','readwrite',x=>x.put(b,id));return{url:'idb:'+id}}};
}catch(e){}
if(!db||!user){app.innerHTML='<h1>🎵 Musiqa</h1><div class="card">Brauzer xotirasi (IndexedDB) ishlamayapti. Boshqa brauzerda oching.</div>';return}
uid=await user.id();const ref=()=>db.doc('people/'+uid);
const T=s=>{s=Math.max(0,s||0);return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')};
const cov=s=>{if(s.cover)return`background-image:url(${E(s.cover)})`;let h=0;for(const c of (s.title||'a'))h=(h*31+c.charCodeAt(0))%360;return`background:linear-gradient(135deg,hsl(${h},70%,55%),hsl(${(h+60)%360},75%,50%))`};
const noc=s=>s.cover?'':'♪';
const all=()=>people.flatMap(p=>(p.songs||[]).map(s=>({...s,owner:p.id,oname:p.first+' '+p.last})));
const isFav=s=>(me.favs||[]).some(f=>f.o==s.owner&&f.i==s.id);
async function upd(o){try{await ref().update(o)}catch(e){alert('Saqlab bo‘lmadi: '+(e.message||e.code))}}
async function fav(s){let f=me.favs||[];f=isFav(s)?f.filter(x=>!(x.o==s.owner&&x.i==s.id)):[...f,{o:s.owner,i:s.id}];await upd({favs:f})}
/* player */
const st=s=>s.start||0,en=s=>s.end&&s.end>(s.start||0)?s.end:(au.duration||0);
function play(list,i){queue=list;qi=i;cur=list[i];if(!cur)return;au.src=cur.url;au.onloadedmetadata=()=>{au.currentTime=st(cur)};au.play().catch(()=>{});
 $('mini').hidden=false;[['mcv'],['big']].forEach(([id])=>{const e=$(id);e.style.cssText=cov(cur);e.textContent=noc(cur)});
 $('mtt').innerHTML=`<b>${E(cur.title)}</b><div class="mu">${E(cur.artist||cur.oname)}</div>`;$('ftt').textContent=cur.title;$('far').textContent=(cur.artist||'')+(cur.artist?' · ':'')+cur.oname;
 $('ted').hidden=cur.owner!=uid;$('ffv').textContent=isFav(cur)?'♥':'♡';render(1)}
function nxt(d=1){if(!queue.length)return;let i=shuf?Math.floor(Math.random()*queue.length):qi+d;if(i>=queue.length)i=0;if(i<0)i=queue.length-1;play(queue,i)}
au.onplay=au.onpause=()=>{$('mpp').textContent=$('fpp').textContent=au.paused?'▶':'⏸'};
au.ontimeupdate=()=>{if(!cur)return;const a=st(cur),b=en(cur);if(b&&au.currentTime>=b-.05){rep?(au.currentTime=a):nxt();return}
 const p=b>a?(au.currentTime-a)/(b-a)*100:0;$('mbar').style.width=p+'%';$('sk').value=p;$('t1').textContent=T(au.currentTime-a);$('t2').textContent=T(b-a)};
$('sk').oninput=()=>{const a=st(cur),b=en(cur);au.currentTime=a+(b-a)*$('sk').value/100};
$('mpp').onclick=$('fpp').onclick=()=>au.paused?au.play():au.pause();
$('mnx').onclick=$('nx').onclick=()=>nxt(1);$('pv').onclick=()=>au.currentTime-st(cur)>3?au.currentTime=st(cur):nxt(-1);
$('sh').onclick=()=>{shuf=!shuf;$('sh').className='ic '+(shuf?'on2':'')};$('rp').onclick=()=>{rep=!rep;$('rp').className='ic '+(rep?'on2':'')};
$('mtt').onclick=()=>$('full').classList.add('show');$('fcl').onclick=()=>$('full').classList.remove('show');
$('ffv').onclick=async()=>{await fav(cur);$('ffv').textContent=isFav(cur)?'♥':'♡'};
$('ted').onclick=()=>edit(cur.id);
/* edit modal: title, artist, cover, trim */
function edit(id){const s=me.songs.find(x=>x.id==id);if(!s)return;let nc=s.cover||'';
 const m=$('modc');m.innerHTML=`<h2 style="margin-top:0">Tahrirlash</h2><input type="text" id="e1" value="${E(s.title)}" placeholder="Nomi"><input type="text" id="e2" value="${E(s.artist||'')}" placeholder="Ijrochi">
 <div class="row" style="margin-bottom:10px"><div class="cv" id="ecv" style="${cov({...s,cover:nc})}">${nc?'':'♪'}</div>${assets?'<input type="file" id="e3" accept="image/*">':''}</div>
 <b>✂️ Qirqish</b><div class="mu">Yoqmagan boshi va oxirini olib tashlang</div>
 <div class="mu" style="margin-top:8px">Boshlanish: <span id="v1"></span></div><input type="range" id="r1" min="0" max="1" step="0.1" value="0">
 <div class="mu">Tugash: <span id="v2"></span></div><input type="range" id="r2" min="0" max="1" step="0.1" value="1">
 <div class="row" style="margin-top:14px"><button class="btn" id="pvw">▶ Sinab ko‘rish</button><span class="sp"></span><button class="btn" id="ec">Bekor</button><button class="btn p" id="es">Saqlash</button></div>
 <div class="row" style="margin-top:12px"><button class="btn" id="ed" style="color:#e5484d">🗑 Qo‘shiqni o‘chirish</button></div>`;
 $('mod').classList.add('show');const a=new Audio(s.url);const r1=$('r1'),r2=$('r2');
 const sync=()=>{if(+r1.value>=+r2.value-1)r1.value=Math.max(0,r2.value-1);$('v1').textContent=T(r1.value);$('v2').textContent=T(r2.value)};
 a.onloadedmetadata=()=>{r1.max=r2.max=a.duration;r1.value=s.start||0;r2.value=s.end&&s.end>0?s.end:a.duration;sync()};r1.oninput=r2.oninput=sync;
 if($('e3'))$('e3').onchange=async e=>{try{const r=await assets.upload(e.target.files[0]);nc=r.url;$('ecv').style.cssText=cov({title:s.title,cover:nc});$('ecv').textContent=''}catch(x){alert('Rasm yuklanmadi')}};
 $('pvw').onclick=()=>{a.currentTime=+r1.value;a.play();const t=setInterval(()=>{if(a.currentTime>=+r2.value||a.paused){a.pause();clearInterval(t)}},100)};
 const close=()=>{a.pause();$('mod').classList.remove('show')};$('ec').onclick=close;
 $('es').onclick=async()=>{const d=a.duration||0;const songs=me.songs.map(x=>x.id==id?{...x,title:$('e1').value.trim()||x.title,artist:$('e2').value.trim(),cover:nc,start:+r1.value,end:+r2.value>=d-.2?0:+r2.value}:x);close();await upd({songs})};
 $('ed').onclick=async()=>{if(!confirm('O‘chirilsinmi?'))return;close();await upd({songs:me.songs.filter(x=>x.id!=id)})}}
/* views */
const row=(s,list,i)=>`<div class="row song ${cur&&cur.id==s.id&&cur.owner==s.owner?'on':''}" data-pl="${i}"><div class="cv" style="${cov(s)}">${noc(s)}</div><div class="sp"><b>${E(s.title)}</b><div class="mu">${E(s.artist||s.oname)}${s.start||s.end?' · ✂️':''}</div></div><button class="ic" data-fv="${i}">${isFav(s)?'♥':'♡'}</button>${s.owner==uid?`<button class="ic" data-ed="${E(s.id)}">⋯</button>`:''}</div>`;
let lst=[];
const list=a=>{lst=a;return a.map((s,i)=>row(s,a,i)).join('')||'<p class="mu">Hozircha qo‘shiq yo‘q.</p>'};
function view(){const S=all();
 if(tab=='home'){const rec=[...S].sort((a,b)=>String(b.id).localeCompare(String(a.id))).slice(0,8);
  return`<h1>Salom, ${E(me.first)}! 👋</h1><div class="mu">Bugun nimani tinglaymiz?</div><div class="grid" style="margin-top:14px"><div class="card stat"><b>${S.length}</b><span class="mu">qo‘shiq</span></div><div class="card stat"><b>${people.length}</b><span class="mu">odam</span></div><div class="card stat"><b>${(me.favs||[]).length}</b><span class="mu">sevimli</span></div></div>
  <h2>🆕 Yangi qo‘shiqlar</h2><div class="card">${list(rec)}</div>`}
 if(tab=='odamlar')return`<h1>Odamlar</h1><div class="mu" style="margin-bottom:12px">Boshqalarning playlistlarini tinglang</div>`+people.map(p=>{const sg=(p.songs||[]).map(s=>({...s,owner:p.id,oname:p.first+' '+p.last}));return`<div class="card"><div class="row"><div class="av">${E(p.first[0]||'?')}${E(p.last[0]||'')}</div><div class="sp"><b>${E(p.first)} ${E(p.last)}${p.id==uid?' (siz)':''}</b><div class="mu">${sg.length} ta qo‘shiq</div></div><button class="btn" data-op="${E(p.id)}">${open==p.id?'Yopish':'Ochish'}</button></div>${open==p.id?'<div style="margin-top:8px">'+(()=>{const h=sg.map((s,i)=>row(s,sg,'p'+p.id+':'+i)).join('');return h||'<p class="mu">Bo‘sh</p>'})()+'</div>':''}</div>`}).join('');
 if(tab=='men'){const sg=(me.songs||[]).map(s=>({...s,owner:uid,oname:me.first+' '+me.last}));
  return`<h1>Mening playlistim</h1><div class="card"><div class="mu" style="margin-bottom:8px">Qo‘shiq yuklash (${sg.length}/100)</div>${assets?'<input type="file" id="f" accept="audio/*" multiple>':'<span class="mu">Yuklash mavjud emas</span>'}<div class="mu" id="stt"></div></div><div class="card">${list(sg)}</div>`}
 if(tab=='qidiruv'){const k=q.toLowerCase();const r=k?S.filter(s=>(s.title+' '+(s.artist||'')+' '+s.oname).toLowerCase().includes(k)):[];
  return`<h1>Qidiruv</h1><input type="search" id="q" placeholder="Qo‘shiq, ijrochi yoki odam..." value="${E(q)}"><div class="card">${k?list(r):'<p class="mu">Yozishni boshlang…</p>'}</div>`}
 if(tab=='fav'){const r=S.filter(isFav);return`<h1>Sevimlilar ♥</h1><div class="card">${list(r)}</div>`}
 return`<h1>Profil</h1><div class="card"><div class="row"><div class="av">${E(me.first[0])}${E(me.last[0])}</div><div class="sp"><b>${E(me.first)} ${E(me.last)}</b><div class="mu">${(me.songs||[]).length}/100 qo‘shiq</div></div></div></div><div class="card"><div class="mu" style="margin-bottom:8px">Ism-familyani o‘zgartirish</div><input type="text" id="pf" value="${E(me.first)}"><input type="text" id="pl" value="${E(me.last)}"><button class="btn p" id="psv">Saqlash</button></div><div class="card"><div class="mu" style="margin-bottom:10px">Ma’lumotlar shu qurilma brauzerida saqlanadi. Bir qurilmada bir nechta odam o‘z nomi bilan kirishi mumkin.</div><button class="btn" id="sw">Boshqa odam sifatida kirish</button></div>`}
const NV=[['home','🏠','Bosh'],['odamlar','👥','Odamlar'],['qidiruv','🔍','Qidiruv'],['fav','♥','Sevimli'],['men','🎧','Mening'],['pro','👤','Profil']];
function render(keep){
 if(!me){$('nv').parentElement.hidden=true;app.innerHTML=`<h1>🎵 Musiqa Playlist</h1><div class="mu" style="margin-bottom:14px">Xush kelibsiz! Davom etish uchun o‘zingizni tanishtiring</div><div class="card"><input type="text" id="fn" placeholder="Ism" maxlength="30"><input type="text" id="ln" placeholder="Familiya" maxlength="30"><button class="btn p" id="go" style="width:100%">Kirish</button></div>${people.length?'<h2>Yoki mavjud odamdan kiring</h2>'+people.map(p=>`<div class="card row"><div class="sp"><b>${E(p.first)} ${E(p.last)}</b></div><button class="btn" data-lg="${E(p.id)}">Kirish</button></div>`).join(''):''}`;
  $('go').onclick=async()=>{const f=$('fn').value.trim(),l=$('ln').value.trim();if(!f||!l)return alert('Ism va familiyani kiriting');try{await ref().set({first:f,last:l,songs:[],favs:[]})}catch(e){alert('Xatolik: '+(e.message||e.code))}};app.querySelectorAll('[data-lg]').forEach(b=>b.onclick=()=>{localStorage.setItem('uid',b.dataset.lg);location.reload()});return}
 $('nv').parentElement.hidden=false;
 const fq=document.activeElement&&document.activeElement.id=='q';
 $('nv').innerHTML=NV.map(n=>`<button data-n="${n[0]}" class="${tab==n[0]?'on':''}"><i>${n[1]}</i>${n[2]}</button>`.replace('data-n="pro"','data-n="pro"')).join('');
 app.innerHTML=view();
 $('nv').querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{tab=b.dataset.n;render();scrollTo(0,0)});
 app.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{open=open==b.dataset.op?null:b.dataset.op;render()});
 app.querySelectorAll('[data-pl]').forEach(b=>b.onclick=e=>{if(e.target.closest('[data-fv],[data-ed]'))return;const k=b.dataset.pl;if(k[0]=='p'){const[pid,i]=k.slice(1).split(':');const p=people.find(x=>x.id==pid);play((p.songs||[]).map(s=>({...s,owner:pid,oname:p.first+' '+p.last})),+i)}else play(lst,+k)});
 app.querySelectorAll('[data-fv]').forEach(b=>b.onclick=()=>{const s=lst[+b.dataset.fv];if(s)fav(s)});
 app.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>edit(b.dataset.ed));
 const qi2=$('q');if(qi2){qi2.oninput=()=>{q=qi2.value;const p=qi2.selectionStart;render();const n=$('q');n.focus();n.setSelectionRange(p,p)};if(fq)qi2.focus()}
 const f=$('f');if(f)f.onchange=async()=>{const s=$('stt');let sg=[...(me.songs||[])];
